<style>
  :root{
    --bg:#FAFAF7;
    --fg:#1C1917;
    --card:#FFFFFF;
    --primary:#B8962E;
    --primary-fg:#FFFFFF;
    --secondary:#F5F0E8;
    --muted:#EDE8DF;
    --muted-fg:#8B7E6E;
    --border:#DDD8CE;
    --destructive:#DC2626;
    --success:#43A047;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  button, input, textarea{font-family:inherit;}
  button{cursor:pointer;}
  input,textarea{outline:none;}
  ::selection{background:var(--primary);color:var(--primary-fg);}

  #root{min-height:100vh;}

  .app-shell{
    display:flex;
    min-height:100vh;
  }

  /* ---------- Sidebar (desktop) ---------- */
  .sidebar{
    width:240px;
    flex-shrink:0;
    border-right:1px solid var(--border);
    padding:28px 16px;
    display:flex;
    flex-direction:column;
    gap:4px;
    position:sticky;
    top:0;
    height:100vh;
  }
  .sidebar-brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 10px 24px;
  }
  .sidebar-brand-mark{
    width:34px;height:34px;border-radius:10px;
    background:var(--primary);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:16px;
    flex-shrink:0;
  }
  .sidebar-brand-text{font-weight:700;font-size:15px;line-height:1.2;}
  .sidebar-brand-sub{font-size:11px;color:var(--muted-fg);margin-top:1px;}

  .nav-item{
    display:flex;align-items:center;gap:12px;
    padding:11px 14px;border-radius:10px;
    border:none;background:transparent;
    color:var(--muted-fg);font-size:14px;font-weight:600;
    text-align:left;width:100%;
    transition:background .15s ease, color .15s ease;
  }
  .nav-item svg{flex-shrink:0;}
  .nav-item:hover{background:var(--secondary);color:var(--fg);}
  .nav-item.active{background:var(--primary);color:#fff;}

  .sidebar-footer{
    margin-top:auto;
    padding-top:12px;
    border-top:1px solid var(--border);
  }
  .save-status{
    display:flex;align-items:center;gap:6px;
    padding:8px 14px 2px;
    font-size:11.5px;color:var(--muted-fg);
    line-height:1.3;
  }
  .save-status span.pulsing{color:var(--success);font-weight:600;}
  .topbar .save-status{padding:2px 0 0;}

  /* ---------- Main column ---------- */
  .main-col{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
  }
  .topbar{
    display:none;
    align-items:center;
    justify-content:space-between;
    padding:16px 18px;
    padding-top:calc(16px + env(safe-area-inset-top));
    border-bottom:1px solid var(--border);
    position:sticky;top:0;
    background:rgba(250,250,247,.92);
    backdrop-filter:blur(8px);
    z-index:20;
  }
  .topbar-title{font-size:19px;font-weight:700;}
  .topbar-btn{
    width:38px;height:38px;border-radius:19px;
    background:var(--secondary);border:none;
    display:flex;align-items:center;justify-content:center;
    color:var(--fg);
  }

  .content{
    flex:1;
    max-width:760px;
    width:100%;
    margin:0 auto;
    padding:28px 24px 80px;
  }

  /* ---------- Bottom nav (mobile) ---------- */
  .bottom-nav{
    display:none;
    position:fixed;left:0;right:0;bottom:0;
    background:rgba(250,250,247,.94);
    backdrop-filter:blur(10px);
    border-top:1px solid var(--border);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    z-index:30;
  }
  .bottom-nav-row{display:flex;}
  .bottom-nav-item{
    flex:1;border:none;background:transparent;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 2px;color:var(--muted-fg);font-size:10.5px;font-weight:600;
  }
  .bottom-nav-item.active{color:var(--primary);}

  @media (max-width: 860px){
    .sidebar{display:none;}
    .topbar{display:flex;}
    .bottom-nav{display:block;}
    .content{padding:18px 16px 100px;}
  }

  /* ---------- Generic UI ---------- */
  .card{
    background:var(--card);
    border-radius:14px;
    box-shadow:0 1px 4px rgba(0,0,0,.07);
  }
  .section-title{
    font-size:12.5px;font-weight:600;color:var(--muted-fg);
    text-transform:uppercase;letter-spacing:.6px;
    margin:0 0 10px;
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:none;border-radius:12px;padding:12px 20px;
    font-size:15px;font-weight:600;
    background:var(--primary);color:var(--primary-fg);
    transition:opacity .15s ease, transform .1s ease;
  }
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-secondary{background:var(--muted);color:var(--fg);}
  .btn-block{width:100%;}
  .btn-ghost{background:transparent;color:var(--primary);padding:10px 14px;}
  .icon-btn{
    border:none;background:transparent;padding:8px;border-radius:8px;
    display:inline-flex;align-items:center;justify-content:center;
    color:var(--muted-fg);
  }
  .icon-btn:hover{background:var(--secondary);}

  .field-label{
    font-size:11.5px;font-weight:600;color:var(--muted-fg);
    text-transform:uppercase;letter-spacing:.5px;
    display:block;margin:16px 0 8px;
  }
  .field-label:first-child{margin-top:0;}
  .input{
    width:100%;background:var(--muted);border:1px solid var(--border);
    border-radius:10px;padding:12px 14px;font-size:16px;color:var(--fg);
  }
  .input::placeholder{color:var(--muted-fg);}
  textarea.input{resize:vertical;min-height:72px;font-family:inherit;}
  .error-text{color:var(--destructive);font-size:13px;margin:-4px 0 12px;}
  .hint-text{font-size:11.5px;color:var(--muted-fg);margin:4px 0 0;}

  .empty-state{
    text-align:center;padding:56px 20px 24px;
    display:flex;flex-direction:column;align-items:center;gap:12px;
  }
  .empty-icon{
    width:72px;height:72px;border-radius:36px;background:var(--muted);
    display:flex;align-items:center;justify-content:center;color:var(--primary);
  }
  .empty-title{font-size:20px;font-weight:700;margin:0;}
  .empty-sub{font-size:14px;color:var(--muted-fg);max-width:320px;line-height:1.45;margin:0;}

  /* ---------- Modal / Sheet ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.45);
    display:flex;align-items:flex-end;justify-content:center;
    z-index:100;
    animation:fadeIn .15s ease;
  }
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .sheet{
    background:var(--bg);
    border-radius:22px 22px 0 0;
    padding:12px 20px 28px;
    width:100%;max-width:520px;
    max-height:88vh;overflow-y:auto;
    animation:slideUp .2s ease;
  }
  @keyframes slideUp{from{transform:translateY(24px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
  @media (min-width:640px){
    .overlay{align-items:center;}
    .sheet{border-radius:20px;padding:22px 26px 26px;}
  }
  .sheet-handle{
    width:38px;height:4px;border-radius:2px;background:var(--border);
    margin:0 auto 18px;
  }
  .sheet-title{font-size:19px;font-weight:700;margin:0 0 4px;}
  .sheet-sub{font-size:13px;color:var(--muted-fg);margin:0 0 16px;line-height:1.5;}

  /* ---------- Heute tab ---------- */
  .greeting-eyebrow{font-size:13px;font-weight:500;color:var(--muted-fg);text-transform:uppercase;letter-spacing:1px;}
  .greeting-day{font-size:28px;font-weight:700;margin:4px 0 2px;}
  .greeting-date{font-size:15px;color:var(--muted-fg);margin:0;}
  .header-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px;}
  .avatar-btn{
    width:38px;height:38px;border-radius:19px;background:var(--primary);
    border:none;color:#fff;font-weight:700;font-size:15px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    box-shadow:0 2px 6px rgba(184,150,46,.35);
  }
  .progress-box{padding:14px 16px;margin-bottom:18px;}
  .progress-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;}
  .progress-head span:first-child{color:var(--muted-fg);font-weight:500;}
  .progress-head span:last-child{color:var(--primary);font-weight:600;}
  .progress-track{height:6px;background:var(--muted);border-radius:3px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--primary);border-radius:3px;transition:width .25s ease;}

  .entry-card{
    display:flex;align-items:stretch;
    background:var(--card);border-radius:14px;margin-bottom:10px;overflow:hidden;
    box-shadow:0 1px 4px rgba(0,0,0,.07);
    border:none;width:100%;text-align:left;padding:0;
  }
  .entry-card.done{opacity:.62;}
  .entry-colorbar{width:5px;flex-shrink:0;}
  .entry-body{flex:1;padding:14px 8px 14px 14px;min-width:0;}
  .entry-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .entry-name{font-size:16px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg);}
  .entry-name.done{text-decoration:line-through;color:var(--muted-fg);}
  .time-badge{
    display:flex;align-items:center;gap:3px;background:var(--muted);
    border-radius:8px;padding:3px 7px;font-size:12px;font-weight:600;color:var(--primary);
    flex-shrink:0;white-space:nowrap;
  }
  .entry-komp{font-size:12px;color:var(--muted-fg);margin-top:2px;}
  .entry-meta{display:flex;align-items:center;gap:8px;margin-top:4px;}
  .entry-dauer{font-size:12px;font-weight:500;color:var(--primary);}
  .entry-notes{font-size:12px;color:var(--muted-fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .checkbox{
    width:26px;height:26px;border-radius:13px;border:2px solid var(--border);
    display:flex;align-items:center;justify-content:center;margin:auto 14px auto 0;flex-shrink:0;
  }

  /* ---------- Kalender tab ---------- */
  .month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .month-title{font-size:18px;font-weight:600;}
  .day-header-row{display:flex;padding:0 2px;margin-bottom:4px;}
  .day-header-cell{flex:1;text-align:center;font-size:11px;font-weight:600;color:var(--muted-fg);text-transform:uppercase;}
  .cal-grid{display:flex;flex-direction:column;}
  .cal-row{display:flex;}
  .cal-cell{
    flex:1;aspect-ratio:1;margin:2px;border-radius:10px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    border:none;background:transparent;color:var(--fg);font-size:14px;font-weight:500;
  }
  .cal-cell.empty{visibility:hidden;}
  .cal-cell.today{border:1.5px solid var(--primary);}
  .cal-cell.selected{background:var(--primary);color:#fff;font-weight:700;}
  .cal-dots{display:flex;gap:2px;align-items:center;}
  .cal-dot{width:4px;height:4px;border-radius:2px;background:var(--primary);}
  .cal-dot.done{background:var(--success);}
  .cal-dot.sel{background:#fff;}

  .print-week-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    background:var(--secondary);border:1px solid var(--border);border-radius:12px;
    padding:11px 14px;margin-top:14px;font-size:13.5px;font-weight:600;color:var(--primary);
  }
  .detail-head{display:flex;align-items:center;justify-content:space-between;margin:18px 0 12px;gap:10px;}
  .detail-title{font-size:17px;font-weight:700;}
  .split-btn{display:flex;align-items:stretch;background:var(--primary);border-radius:10px;overflow:hidden;flex-shrink:0;}
  .split-main{display:flex;align-items:center;gap:5px;border:none;background:transparent;color:#fff;font-size:13px;font-weight:600;padding:9px 8px 9px 12px;}
  .split-div{width:1px;background:rgba(255,255,255,.3);}
  .split-arrow{border:none;background:transparent;color:#fff;padding:9px 9px;display:flex;align-items:center;}

  .mode-menu{
    position:absolute;background:var(--card);border-radius:14px;min-width:170px;
    box-shadow:0 6px 20px rgba(0,0,0,.18);overflow:hidden;z-index:60;
  }
  .mode-option{display:flex;align-items:center;gap:10px;width:100%;border:none;background:transparent;
    padding:12px 15px;font-size:14.5px;font-weight:600;color:var(--fg);}
  .mode-option.active{background:var(--muted);color:var(--primary);}
  .mode-option-divider{height:1px;background:var(--border);}

  .day-item-card{display:flex;align-items:stretch;background:var(--card);border-radius:12px;margin-bottom:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .day-item-colorbar{width:4px;flex-shrink:0;}
  .day-item-check{width:22px;height:22px;border-radius:11px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;margin:auto 0 auto 10px;flex-shrink:0;border-width:2px;}
  .day-item-icon{width:32px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:auto 0 auto 10px;flex-shrink:0;}
  .day-item-info{flex:1;padding:12px 6px 12px 10px;min-width:0;}
  .day-item-name{font-size:15px;font-weight:600;color:var(--fg);}
  .day-item-actions{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:6px 6px 6px 0;}

  .color-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  .color-swatch{width:32px;height:32px;border-radius:16px;border:none;display:flex;align-items:center;justify-content:center;}
  .color-swatch.selected{box-shadow:0 0 0 3px #fff, 0 0 0 5px currentColor;}
  .time-row{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
  .time-input{flex:1;text-align:center;margin-bottom:0 !important;}
  .time-sep{font-size:20px;font-weight:700;}
  .time-suffix{font-size:14px;color:var(--muted-fg);white-space:nowrap;}
  .stueck-picker{max-height:170px;overflow-y:auto;border:1px solid var(--border);border-radius:12px;margin-bottom:4px;}
  .stueck-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);border:none;background:transparent;width:100%;text-align:left;}
  .stueck-row:last-child{border-bottom:none;}
  .stueck-row.selected{background:var(--muted);}
  .stueck-row-dot{width:10px;height:10px;border-radius:5px;flex-shrink:0;}
  .stueck-row-text{flex:1;min-width:0;}
  .stueck-row-name{font-size:14px;font-weight:600;color:var(--fg);}
  .stueck-row-komp{font-size:12px;color:var(--muted-fg);}

  /* ---------- Stoppuhr tab ---------- */
  .chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;}
  .chip{
    display:flex;align-items:center;gap:6px;background:var(--muted);border:none;
    border-radius:20px;padding:8px 14px;font-size:14px;font-weight:500;color:var(--fg);
    white-space:nowrap;flex-shrink:0;
  }
  .chip.active{color:#fff;font-weight:600;}
  .chip-dot{width:8px;height:8px;border-radius:4px;flex-shrink:0;}
  .timer-box{display:flex;flex-direction:column;align-items:center;padding:32px 20px;gap:12px;}
  .timer-piece{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:20px;padding:6px 14px;}
  .timer-dot{width:8px;height:8px;border-radius:4px;}
  .timer-piece-name{font-size:14px;font-weight:600;color:var(--fg);}
  .timer-piece-komp{font-size:13px;color:var(--muted-fg);}
  .timer-text{font-size:60px;font-weight:700;letter-spacing:2px;font-variant-numeric:tabular-nums;}
  .running-dot{width:8px;height:8px;border-radius:4px;animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .main-timer-btn{
    width:80px;height:80px;border-radius:40px;border:none;color:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,.22);margin:8px auto 16px;
  }
  .action-row{display:flex;gap:12px;padding:0 4px;margin-bottom:8px;}
  .action-row .btn{flex:1;}
  .saved-banner{display:flex;align-items:center;justify-content:center;gap:8px;background:#E8F5E9;border-radius:12px;padding:12px;margin-bottom:8px;color:var(--success);font-weight:600;font-size:14.5px;}
  .history-title{font-size:15px;font-weight:700;padding-top:16px;margin-top:8px;border-top:1px solid var(--border);}
  .session-card{display:flex;align-items:center;background:var(--card);border-radius:12px;margin-bottom:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .session-colorbar{width:4px;align-self:stretch;flex-shrink:0;}
  .session-info{flex:1;padding:12px 0 12px 12px;min-width:0;}
  .session-name{font-size:14px;font-weight:600;color:var(--fg);}
  .session-date{font-size:12px;color:var(--muted-fg);margin-top:2px;}
  .session-time{font-size:14px;font-weight:700;padding:0 10px;white-space:nowrap;}

  /* ---------- Statistik tab ---------- */
  .filter-row{display:flex;gap:8px;margin-bottom:16px;}
  .filter-btn{flex:1;border:none;background:var(--muted);color:var(--muted-fg);
    border-radius:10px;padding:9px 4px;font-size:12.5px;font-weight:600;}
  .filter-btn.active{background:var(--primary);color:#fff;}
  .summary-card{display:flex;padding:16px;margin-bottom:18px;}
  .summary-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--primary);}
  .summary-value{font-size:17px;font-weight:700;color:var(--fg);}
  .summary-label{font-size:11px;color:var(--muted-fg);}
  .summary-div{width:1px;background:var(--border);margin:4px 2px;}
  .goal-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;}
  .goal-card{
    background:var(--card);border-radius:16px;overflow:hidden;display:flex;flex-shrink:0;
    width:min(340px,86vw);box-shadow:0 1px 4px rgba(0,0,0,.07);scroll-snap-align:start;
  }
  .goal-colorbar{width:5px;flex-shrink:0;}
  .goal-body{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;}
  .goal-head{display:flex;align-items:flex-start;gap:10px;}
  .goal-name{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg);}
  .goal-komp{font-size:12px;color:var(--muted-fg);margin-top:2px;}
  .goal-row{display:flex;align-items:center;}
  .goal-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
  .goal-item-label{font-size:10px;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.4px;}
  .goal-item-value{font-size:15.5px;font-weight:700;}
  .goal-div{width:1px;height:34px;background:var(--border);}
  .goal-track{height:8px;background:var(--muted);border-radius:4px;overflow:hidden;}
  .goal-fill{height:100%;border-radius:4px;transition:width .25s ease;}
  .stat-card{display:flex;background:var(--card);border-radius:14px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);}
  .stat-colorbar{width:5px;flex-shrink:0;}
  .stat-body{flex:1;padding:14px;min-width:0;}
  .stat-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px;}
  .stat-name{font-size:15px;font-weight:600;color:var(--fg);}
  .stat-komp{font-size:12px;color:var(--muted-fg);margin-top:2px;}
  .stat-time{font-size:15px;font-weight:700;flex-shrink:0;}
  .bar-track{height:6px;background:var(--muted);border-radius:3px;overflow:hidden;margin-bottom:6px;}
  .bar-fill{height:100%;border-radius:3px;transition:width .25s ease;}
  .stat-sessions{font-size:11px;color:var(--muted-fg);}

  /* ---------- Stücke tab ---------- */
  .stueck-list-head{font-size:13px;color:var(--muted-fg);margin-bottom:12px;}
  .piece-card{display:flex;align-items:center;background:var(--card);border-radius:14px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07);border:none;width:100%;text-align:left;padding:0;cursor:pointer;}
  .piece-colorbar{width:5px;align-self:stretch;flex-shrink:0;}
  .piece-thumb{width:52px;height:52px;border-radius:8px;object-fit:cover;flex-shrink:0;display:block;}
  .piece-thumb-btn{position:relative;border:none;background:transparent;padding:0;margin-left:10px;flex-shrink:0;line-height:0;}
  .piece-thumb-count{
    position:absolute;bottom:3px;right:3px;background:rgba(0,0,0,.65);color:#fff;
    font-size:10px;font-weight:700;border-radius:8px;padding:1px 5px;line-height:1.3;
  }
  .piece-iconbox{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;margin-left:12px;flex-shrink:0;}
  .piece-info{flex:1;padding:14px 6px 14px 12px;min-width:0;}
  .piece-name{font-size:16px;font-weight:600;color:var(--fg);}
  .piece-komp{font-size:13px;color:var(--muted-fg);margin-top:2px;}
  .piece-notes{font-size:12px;color:var(--muted-fg);margin-top:3px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .piece-count{font-size:12px;font-weight:500;color:var(--primary);margin-top:4px;}
  .piece-actions{display:flex;flex-direction:column;gap:2px;padding-right:8px;}
  .fab{
    position:fixed;right:24px;bottom:96px;width:56px;height:56px;border-radius:28px;
    background:var(--primary);border:none;color:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(184,150,46,.45);z-index:40;
  }
  @media (min-width:861px){.fab{bottom:32px;}}
  .photo-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
  .photo-slot{
    width:64px;height:64px;border-radius:10px;overflow:hidden;position:relative;flex-shrink:0;
  }
  .photo-slot.filled img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-slot-remove{
    position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:10px;
    background:rgba(0,0,0,.55);border:none;display:flex;align-items:center;justify-content:center;
  }
  .photo-slot.add{
    border:1.5px dashed var(--border);background:var(--muted);
    display:flex;align-items:center;justify-content:center;
  }
  .photo-slot.add:disabled{opacity:.5;}

  /* ---------- Photo gallery / lightbox ---------- */
  .gallery-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:400;
    display:flex;align-items:center;justify-content:center;
    animation:fadeIn .15s ease;
  }
  .gallery-scroll{
    width:100%;height:100%;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
  }
  .gallery-page{
    flex:0 0 100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;
    padding:56px 20px;box-sizing:border-box;
  }
  .gallery-page img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;}
  .gallery-close{
    position:fixed;top:18px;right:18px;width:40px;height:40px;border-radius:20px;
    background:rgba(255,255,255,.15);border:none;display:flex;align-items:center;justify-content:center;z-index:410;
  }
  .gallery-nav{
    position:fixed;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:22px;
    background:rgba(255,255,255,.15);border:none;display:flex;align-items:center;justify-content:center;z-index:410;
  }
  .gallery-nav-left{left:14px;}
  .gallery-nav-right{right:14px;}
  @media (max-width:640px){.gallery-nav{display:none;}}
  .gallery-dots{
    position:fixed;bottom:26px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:410;
  }
  .gallery-dot{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.4);}
  .gallery-dot.active{background:#fff;}

  /* ---------- Settings sheet ---------- */
  .settings-row{display:flex;align-items:center;gap:12px;padding:13px 4px;}
  .settings-icon{width:34px;height:34px;border-radius:9px;background:color-mix(in srgb, var(--primary) 14%, transparent);display:flex;align-items:center;justify-content:center;color:var(--primary);flex-shrink:0;}
  .settings-icon.danger{background:#FEE2E2;color:#DC2626;}
  .settings-text{flex:1;min-width:0;}
  .settings-title{font-size:15px;font-weight:600;}
  .settings-sub{font-size:12px;color:var(--muted-fg);margin-top:1px;line-height:1.4;}
  .toggle{
    width:46px;height:27px;border-radius:14px;border:none;background:var(--border);position:relative;flex-shrink:0;transition:background .15s;
  }
  .toggle.on{background:var(--primary);}
  .toggle-knob{position:absolute;top:2px;left:2px;width:23px;height:23px;border-radius:12px;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .toggle.on .toggle-knob{transform:translateX(19px);}
  .settings-divider{height:1px;background:var(--border);margin:0 4px;}
  .toast{
    position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:var(--fg);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:500;
    z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.25);
    animation:toastIn .18s ease;
  }
  @media (min-width:861px){.toast{bottom:28px;}}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}

  a{color:var(--primary);}

  /* ---------- Druckansicht (Wochenplan) ---------- */
  #print-week{display:none;}
  @media print{
    body *{visibility:hidden;}
    #print-week, #print-week *{visibility:visible;}
    #print-week{
      display:block !important;position:absolute;top:0;left:0;width:100%;
      padding:28px;color:#000;background:#fff;
    }
    #print-week h1{font-size:22px;margin:0 0 2px;color:#000;}
    #print-week > p{font-size:13px;color:#444;margin:0 0 22px;}
    .print-day{break-inside:avoid;margin-bottom:16px;}
    .print-day h2{font-size:14.5px;border-bottom:1px solid #ccc;padding-bottom:5px;margin:0 0 8px;color:#000;}
    .print-day ul{margin:0;padding-left:4px;list-style:none;}
    .print-day li{font-size:13px;margin-bottom:5px;color:#000;}
    .print-check{display:inline-block;margin-right:6px;font-size:14px;}
    .print-note{color:#555;}
    .print-termin{color:#555;font-style:italic;}
    .print-empty{font-size:13px;color:#999;margin:0;}
  }
</style>
</head>
<body>
